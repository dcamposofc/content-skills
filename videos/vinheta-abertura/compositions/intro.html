  <script>
    const tl = gsap.timeline({ paused: true });

    // 0.15–1.25 s: blinds open top to bottom, the camera settles onto the avatar.
    tl.fromTo(
      ".intro-slat",
      { scaleY: 1, transformOrigin: "50% 0%" },
      { scaleY: 0, duration: 0.7, ease: "expo.out", stagger: 0.06 },
      0.15,
    );
    tl.fromTo(
      "#intro-cam",
      { scale: 1.14, filter: "brightness(0.55)" },
      { scale: 1, filter: "brightness(1)", duration: 1.6, ease: "power2.out" },
      0.1,
    );
    tl.fromTo("#intro-scrim", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 0.8);

    // 1.2 s: the name blurs in while it closes horizontally, then holds dead still.
    tl.fromTo(
      "#intro-name",
      { opacity: 0, filter: "blur(10px)", scaleX: 1.22 },
      { opacity: 1, filter: "blur(0px)", scaleX: 1, duration: 0.7, ease: "expo.out" },
      1.2,
    );
    // 1.6 s: the brass rule draws out from the centre.
    tl.fromTo(
      "#intro-rule",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.55, ease: "expo.out" },
      1.6,
    );
    // 1.85 s: the tagline blurs in.
    tl.fromTo(
      "#intro-tag",
      { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
      1.85,
    );

    // 4.25 s: title blurs out, then the blinds snap shut to black by 4.9 s.
    tl.to(
      "#intro-title > *",
      { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in", stagger: 0.04 },
      4.25,
    );
    tl.fromTo(
      ".intro-slat",
      { scaleY: 0, transformOrigin: "50% 100%" },
      { scaleY: 1, duration: 0.38, ease: "power3.in", stagger: 0.025, immediateRender: false },
      4.35,
    );

    window.__timelines["intro"] = tl;
  </script>
