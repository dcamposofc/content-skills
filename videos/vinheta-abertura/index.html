<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"channel-name","type":"string","label":"Nome do canal","default":"DCAMPOS","maxLength":14},
    {"id":"tagline","type":"string","label":"Slogan","default":"tecnologia · IA · execução","maxLength":40},
    {"id":"avatar","type":"string","label":"Avatar (imagem)","default":"assets/avatar.jpg"},
    {"id":"color-ground","type":"color","label":"Fundo","default":"#0b0806"},
    {"id":"color-ink","type":"color","label":"Texto","default":"#f3e7cf"},
    {"id":"color-accent","type":"color","label":"Destaque (latão)","default":"#d4a04c"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #0b0806;
        --color-ink: #f3e7cf;
        --color-accent: #d4a04c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
